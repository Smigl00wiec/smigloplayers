name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Jave
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Zbuduj plugin
        run: mvn -B clean package

      - name: Wyslij jar
        uses: actions/upload-artifact@v4
        with:
          name: SmigloPlayers
          path: target/SmigloPlayers-*.jar
